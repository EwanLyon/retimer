<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Retimer</title>
	<meta name="description"
		content="Time YouTube speedrun VODs frame by frame, set start and end points, and copy the result.">
	<meta name="robots" content="index, follow">
	<meta name="theme-color" content="#dbfff4">
	<link rel="canonical" href="https://ewanlyon.github.io/retimer/">
	<meta property="og:title" content="Retimer">
	<meta property="og:description"
		content="Time YouTube speedrun VODs frame by frame, set start and end points, and copy the result.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://ewanlyon.github.io/retimer/">
	<meta property="og:site_name" content="Retimer">
	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="Retimer">
	<meta name="twitter:description"
		content="Time YouTube speedrun VODs frame by frame, set start and end points, and copy the result.">
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Retimer",
			"url": "https://ewanlyon.github.io/retimer/",
			"description": "A browser-based tool for timing YouTube speedrun VODs frame by frame.",
			"applicationCategory": "MultimediaApplication",
			"operatingSystem": "Web Browser",
			"inLanguage": "en"
		}
	</script>
	<script src="https://www.youtube.com/iframe_api" defer></script>
	<style>
		:root {
			color-scheme: light dark;
			--bg-colour: light-dark(#dbfff4, #0b0b0b);
			--text-colour: light-dark(#000, #fff);
		}

		body {
			background-color: var(--bg-colour);
			color: var(--text-colour);
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;

			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 15px;

			padding-bottom: 5rem;

			* {
				text-align: center;
				text-wrap: balance;
			}
		}

		#player {
			width: 95%;
			height: auto;
			aspect-ratio: 16 / 9;

			max-width: 1300px;
		}

		h1 {
			margin: 0;
			margin-top: 20px;
		}

		#video-url {
			min-width: 300px;
			width: fit-content;
			text-align: center;

			@media (max-width: 500px) {
				width: 95%;
				min-width: unset;
			}
		}

		#video-controls {
			display: flex;
			gap: 10px;

			button {
				min-width: 100px;
			}

			.controls {
				width: 100%;
				display: flex;
				gap: 10px;

				@media (max-width: 500px) {
					flex-direction: column;

					button {
						width: 100%;
						min-width: unset;
					}
				}
			}

			@media (max-width: 500px) {
				width: 95%;
			}

			@media (max-width: 300px) {
				flex-direction: column;
			}
		}

		#time-controls {
			display: flex;
			gap: 10px;

			@media (max-width: 500px) {
				flex-direction: column;
			}
		}

		.time-input {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 5px;

			.set {
				width: 100%;
				font-size: 1.2em;
				height: 30px;
			}

			@media (max-width: 500px) {
				input {
					min-width: unset;
					width: 95%;
				}
			}
		}

		#custom-frame-rate {
			width: 2rem;
		}

		#result {
			display: flex;
			align-items: center;
			flex-direction: column;
			font-family: monospace;

			#final-time {
				font-size: 3em;
				margin: 0;

				cursor: pointer;

				&:active {
					color: light-dark(#3f3f3f, #b6b6b6);
				}
			}
		}
	</style>
</head>

<body>
	<h1>Retimer</h1>
	<input type="text" id="video-url" placeholder="Enter YouTube Video ID or URL">
	<span>Remember to set the video to the highest resolution!</span>
	<div id="player"></div>
	<div id="video-controls">
		<div class="controls">
			<button id="step-backward-five-frames-button">-5 Frames</button>
			<button id="step-backward-frame-button">-1 Frame</button>
		</div>
		<div class="controls">
			<button id="step-forward-frame-button">+1 Frame</button>
			<button id="step-forward-five-frames-button">+5 Frames</button>
		</div>
	</div>
	<div id="time-controls">
		<div class="time-input">
			<button id="set-start-time-button" class="set">Set Start</button>
			<input type="number" id="start-time" placeholder="Start Time (seconds)">
			<button id="go-to-start-time-button" class="seek">Go To Start</button>
		</div>
		<div class="time-input">
			<button id="set-end-time-button" class="set">Set End</button>
			<input type="number" id="end-time" placeholder="End Time (seconds)">
			<button id="go-to-end-time-button" class="seek">Go To End</button>
		</div>
	</div>
	<div id="frame-rate">
		<button id="set-frame-rate-60">60</button>
		<button id="set-frame-rate-30">30</button>
		<input type="number" id="custom-frame-rate" value="60" /> FPS
	</div>
	<div id="result">
		<span id="frame-count"></span>
		<h2 id="final-time">?h ?m ?s ???ms</h2>
	</div>

	<script>
		// @ts-check

		/**
		 * @type {YT.Player}
		 */
		let player;

		let frameRate = 60;

		const INVALID_TIME_TEXT = "?h ?m ?s ???ms";

		const VIDEO_URL_PARAM = "video";
		const START_TIME_PARAM = "start";
		const END_TIME_PARAM = "end";
		const FRAME_RATE_PARAM = "frameRate";

		const videoUrlInput = document.getElementById("video-url");

		const backwardFiveFramesButton = document.getElementById("step-backward-five-frames-button");
		const backwardFrameButton = document.getElementById("step-backward-frame-button");
		const forwardFrameButton = document.getElementById("step-forward-frame-button");
		const forwardFiveFramesButton = document.getElementById("step-forward-five-frames-button");

		const setStartTimeButton = document.getElementById("set-start-time-button");
		const setEndTimeButton = document.getElementById("set-end-time-button");

		const goToStartTimeButton = document.getElementById("go-to-start-time-button");
		const goToEndTimeButton = document.getElementById("go-to-end-time-button");

		const startTimeInput = document.getElementById("start-time");
		const endTimeInput = document.getElementById("end-time");

		const setFrameRate60Button = document.getElementById("set-frame-rate-60");
		const setFrameRate30Button = document.getElementById("set-frame-rate-30");
		const customFrameRateInput = document.getElementById("custom-frame-rate");

		const frameCountText = document.getElementById("frame-count");
		const finalTimeText = document.getElementById("final-time");

		// Read URL parameters and set the video URL and time input value if present
		const urlParams = new URLSearchParams(window.location.search);
		const videoId = urlParams.get(VIDEO_URL_PARAM);
		if (videoId && videoUrlInput instanceof HTMLInputElement) {
			videoUrlInput.value = videoId;
		}
		const start = urlParams.get(START_TIME_PARAM);
		if (start && startTimeInput instanceof HTMLInputElement) {
			startTimeInput.value = start;
		}
		const end = urlParams.get(END_TIME_PARAM);
		if (end && endTimeInput instanceof HTMLInputElement) {
			endTimeInput.value = end;
		}
		const frameRateParam = urlParams.get(FRAME_RATE_PARAM);
		if (frameRateParam && customFrameRateInput instanceof HTMLInputElement) {
			const parsedFrameRate = parseFloat(frameRateParam);
			if (!isNaN(parsedFrameRate) && parsedFrameRate > 0) {
				frameRate = parsedFrameRate;
				customFrameRateInput.value = frameRate.toString();
			}
		}

		if (start && end) {
			calculateTime();
		}

		videoUrlInput?.addEventListener("input", (event) => {
			if (!event.target || !(event.target instanceof HTMLInputElement)) return;

			const urlOrId = event.target.value;
			const videoId = extractVideoId(urlOrId);
			if (!player || !videoId) return;

			player.loadVideoById(videoId);
			const url = new URL(window.location.href);
			url.searchParams.set(VIDEO_URL_PARAM, videoId);
			window.history.replaceState({}, "", url);

			player.playVideo();
			player.setPlaybackQuality('large');
		});

		/**
		 * Extracts the video Id from a YouTube URL or returns the input if it's already an Id.
		 * @param {string} urlOrId 
		 * @returns {string}
		 */
		function extractVideoId(urlOrId) {
			const youtubeUrlRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
			const match = urlOrId.match(youtubeUrlRegex);
			return match ? match[1] : urlOrId;
		}

		function onYouTubeIframeAPIReady() {
			player = new YT.Player('player', {
				height: '900',
				width: '1600',
				playerVars: {
					'playsinline': 1
				},
				events: {
					'onReady': onPlayerReady,
					'onError': (event) => {
						console.error("YouTube Player Error", event);
					}
				},
				...(videoId ? { videoId } : {})
			});
		}

		/**
		 * @param {YT.PlayerEvent} event
		 */
		function onPlayerReady(event) {
			event.target.playVideo();
			event.target.setPlaybackQuality('large');
		}

		startTimeInput?.addEventListener("input", calculateTime);
		endTimeInput?.addEventListener("input", calculateTime);

		function calculateTime() {
			if (!finalTimeText || !frameCountText || !(startTimeInput instanceof HTMLInputElement) || !(endTimeInput instanceof HTMLInputElement)) return;

			const startTime = parseFloat(startTimeInput.value);
			const endTime = parseFloat(endTimeInput.value);

			if (isNaN(startTime) || isNaN(endTime)) {
				finalTimeText.textContent = INVALID_TIME_TEXT;
				return;
			}

			const startFrame = timeToFrame(startTime, frameRate);
			const endFrame = timeToFrame(endTime, frameRate);
			const frameCount = endFrame - startFrame;
			const finalTime = frameCount / frameRate;

			// Format time like "0h 0m 0s 000ms"
			const totalMilliseconds = Math.round(finalTime * 1000);
			const hours = Math.floor(totalMilliseconds / 3_600_000);
			const minutes = Math.floor((totalMilliseconds % 3_600_000) / 60_000);
			const seconds = Math.floor((totalMilliseconds % 60_000) / 1000);
			const milliseconds = totalMilliseconds % 1000;

			frameCountText.textContent = `${frameCount} ${frameCount === 1 ? "frame" : "frames"}`;
			finalTimeText.textContent = `${hours}h ${minutes}m ${seconds}s ${milliseconds.toString().padStart(3, "0")}ms`;

			// Set URL parameters in case the user wants to share the link
			const url = new URL(window.location.href);
			url.searchParams.set(START_TIME_PARAM, startTime.toString());
			url.searchParams.set(END_TIME_PARAM, endTime.toString());
			window.history.replaceState({}, "", url);
		}

		/**
		 * 
		 * @param {number} frames 
		 * @returns {void}
		 */
		function adjustFrame(frames) {
			if (!player) return;

			const currentTime = player.getCurrentTime();
			const frameDuration = 1 / 60; // YouTube can be at most 60fps

			const newTime = currentTime + frames * frameDuration;
			goToTime(newTime);
		}

		forwardFrameButton?.addEventListener("click", () => {
			adjustFrame(1);
		});

		backwardFrameButton?.addEventListener("click", () => {
			adjustFrame(-1);
		});

		forwardFiveFramesButton?.addEventListener("click", () => {
			adjustFrame(5);
		});

		backwardFiveFramesButton?.addEventListener("click", () => {
			adjustFrame(-5);
		});

		setStartTimeButton?.addEventListener("click", () => {
			if (!player || !(startTimeInput instanceof HTMLInputElement)) return;

			const currentTime = timeToPossibleFrameTime(player.getCurrentTime(), frameRate);
			startTimeInput.value = currentTime.toString();
			calculateTime();
		});

		setEndTimeButton?.addEventListener("click", () => {
			if (!player || !(endTimeInput instanceof HTMLInputElement)) return;

			const currentTime = timeToPossibleFrameTime(player.getCurrentTime(), frameRate);
			endTimeInput.value = currentTime.toString();
			calculateTime();
		});

		/**
		 * 
		 * @param {number} time 
		 * @returns {void}
		 */
		function goToTime(time) {
			if (!player) return;

			player.seekTo(time, true);
		}

		goToStartTimeButton?.addEventListener("click", () => {
			if (!(startTimeInput instanceof HTMLInputElement)) return;

			const startTime = parseFloat(startTimeInput.value);
			if (isNaN(startTime)) return;

			goToTime(startTime);
		});

		goToEndTimeButton?.addEventListener("click", () => {
			if (!(endTimeInput instanceof HTMLInputElement)) return;

			const endTime = parseFloat(endTimeInput.value);
			if (isNaN(endTime)) return;

			goToTime(endTime);
		});

		/**
		 * 
		 * @param {number} time 
		 * @param {number} fps 
		 * @returns {number}
		 */
		function timeToPossibleFrameTime(time, fps = 60) {
			const frameDuration = 1 / fps;
			return Math.floor(time / frameDuration) * frameDuration;
		}

		/**
		 * @param {number} time
		 * @param {number} fps
		 * @returns {number}
		 */
		function timeToFrame(time, fps) {
			return Math.round(time * fps);
		}

		if (finalTimeText) {
			finalTimeText.onclick = () => {
				// Copy the final time text to the clipboard
				navigator.clipboard.writeText(finalTimeText.textContent ?? "").then(() => {
					console.log("Final time copied to clipboard");
				}).catch((err) => {
					console.error("Could not copy final time to clipboard", err);
				});
			};
		}

		if (setFrameRate60Button) {
			setFrameRate60Button.onclick = () => {
				setFrameRate(60);
			};
		}

		if (setFrameRate30Button) {
			setFrameRate30Button.onclick = () => {
				setFrameRate(30);
			};
		}

		customFrameRateInput?.addEventListener("input", () => {
			if (!(customFrameRateInput instanceof HTMLInputElement)) return;

			const newFrameRate = parseFloat(customFrameRateInput.value);
			setFrameRate(newFrameRate);
		});

		/**
		 * Sets the frame rate and updates the custom frame rate input value.
		 * @param {number} newFrameRate 
		 */
		function setFrameRate(newFrameRate) {
			if (!(customFrameRateInput instanceof HTMLInputElement)) return;

			frameRate = newFrameRate;
			customFrameRateInput.value = newFrameRate.toString();
			calculateTime();

			// Set URL parameters in case the user wants to share the link
			const url = new URL(window.location.href);
			url.searchParams.set("frameRate", newFrameRate.toString());
			window.history.replaceState(null, "", url.toString());
		}
	</script>
</body>

</html>
